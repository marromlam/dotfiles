# Status bar configuration
# Requires a theme (colors.conf or a themes/*.tmux) to be sourced first

# ------------------------------------------------------------------------------
# General options {{{
# ------------------------------------------------------------------------------

set-option -g status on
set-option -g status-position top
set-option -g status-style fg=$STATUS_BAR_FG_COLOR,bg=$STATUS_BAR_BG_COLOR
set-option -g status-justify absolute-centre
set-option -g status-interval 10
set -g status-left-length 30
set -g status-right-length 60

# Powerline-style separators

# pills mode

# Color definitions
STATUS_BAR_BG_COLOR="#111111"
# STATUS_BAR_BG_COLOR="#22212C"
STATUS_BAR_FG_COLOR="#CDCDC8"
STATUS_BAR_FG_COLOR="#FFCDC8"
ACTIVE_FG_COLOR="#F8F8F2"
INACTIVE_FG_COLOR="#7970A9"

# Bubble colors for session/windows
# Bubbles share the statusbar background — text color differentiates active/inactive
SESSION_BUBBLE_BG_COLOR="$STATUS_BAR_BG_COLOR"
SESSION_BUBBLE_FG_COLOR="$STATUS_BAR_FG_COLOR"
SESSION_BUBBLEON_BG_COLOR="$STATUS_BAR_BG_COLOR"
SESSION_BUBBLEON_FG_COLOR="#8AFF80"

WINDOW_BUBBLE_BG_COLOR="$STATUS_BAR_BG_COLOR"
WINDOW_BUBBLE_FG_COLOR="$STATUS_BAR_FG_COLOR"
WINDOW_BUBBLEON_BG_COLOR="$STATUS_BAR_BG_COLOR"
WINDOW_BUBBLEON_FG_COLOR="$ACTIVE_FG_COLOR"


LBORDER=""
RBORDER=""
WINDOW_LBORDER=""
WINDOW_RBORDER=""
SESSION_INNER_BORDER=" "
WINDOW_INNER_BORDER=" "
WINDOW_SEPARATION_BORDER=" "


# PLAIN MODE ------------------------------------------------------------------
# Color definitions
STATUS_BAR_BG_COLOR="#aaaaaa"
STATUS_BAR_FG_COLOR="#333333"
ACTIVE_FG_COLOR="#111111"
INACTIVE_FG_COLOR="#eeeeee"

TINT_BG_COLOR="#ff0000"
TINT_FG_COLOR="#0000ff"


PANE_BORDER_COLOR1="#444444"
PANE_BORDER_COLOR0="#444444"



# Bubble colors for session/windows
# Bubbles share the statusbar background — text color differentiates active/inactive
SESSION_BUBBLE_BG_COLOR0="$STATUS_BAR_FG_COLOR"
SESSION_BUBBLE_FG_COLOR0="$STATUS_BAR_BG_COLOR"
SESSION_BUBBLE_BG_COLOR1="$TINT_FG_COLOR"
SESSION_BUBBLE_FG_COLOR1="$TINT_BG_COLOR"

WINDOW_BUBBLE_BG_COLOR0="$STATUS_BAR_FG_COLOR"
WINDOW_BUBBLE_FG_COLOR0="$STATUS_BAR_BG_COLOR"
WINDOW_BUBBLE_BG_COLOR1="$STATUS_BAR_FG_COLOR"
WINDOW_BUBBLE_FG_COLOR1="$STATUS_BAR_BG_COLOR"


LBORDER="█"
RBORDER="█"
WINDOW_LBORDER="█"
WINDOW_RBORDER="█"
SESSION_INNER_BORDER=""
WINDOW_INNER_BORDER=" "
WINDOW_SEPARATION_BORDER=""

set-option -g status-style fg=$STATUS_BAR_FG_COLOR,bg=$STATUS_BAR_BG_COLOR








# Icons
SESSION_ICON="󱂬"
BELL_ICON="󰂚"
# FULL_FILLED_BLOCK="█"

# }}}


# ------------------------------------------------------------------------------
# Pane borders & messages {{{
# ------------------------------------------------------------------------------

set-option -g pane-active-border-style fg=$PANE_BORDER_COLOR1
set-option -g pane-border-style fg=$PANE_BORDER_COLOR0

set-option -g message-style bg=$STATUS_BAR_FG_COLOR,fg=$STATUS_BAR_BG_COLOR,bold
set-option -g message-command-style bg=$STATUS_BAR_FG_COLOR,fg=$STATUS_BAR_BG_COLOR,bold

set-option -g monitor-activity off
set-option -g visual-activity off

# }}}


# ------------------------------------------------------------------------------
# Battery plugin icons {{{
# ------------------------------------------------------------------------------

# Status icons (charged/charging/discharging state)
set -g @batt_icon_status_charged    ""
set -g @batt_icon_status_attached   ""
set -g @batt_icon_status_charging   ""
set -g @batt_icon_status_discharging ""
set -g @batt_icon_status_unknown    ""

# Charge tier icons (used by #{battery_icon}, 8 tiers from full to empty)
set -g @batt_icon_charge_tier8 ""
set -g @batt_icon_charge_tier7 ""
set -g @batt_icon_charge_tier6 ""
set -g @batt_icon_charge_tier5 ""
set -g @batt_icon_charge_tier4 ""
set -g @batt_icon_charge_tier3 ""
set -g @batt_icon_charge_tier2 ""
set -g @batt_icon_charge_tier1 ""

set -g @batt_remain_short 'true'

# }}}


# ------------------------------------------------------------------------------
# Status left — session bubble (prefix-aware) + pomodoro {{{
# ------------------------------------------------------------------------------

STATUS_INACTIVE=""\
"#[fg=$SESSION_BUBBLE_FG_COLOR0 bg=$SESSION_BUBBLE_BG_COLOR0]$LBORDER"\
"#[fg=$SESSION_BUBBLE_BG_COLOR0 bg=$SESSION_BUBBLE_FG_COLOR0]$SESSION_INNER_BORDER$SESSION_ICON #S$SESSION_INNER_BORDER"\
"#[fg=$SESSION_BUBBLE_FG_COLOR0 bg=$SESSION_BUBBLE_BG_COLOR0]$RBORDER"

STATUS_ACTIVE=""\
"#[fg=$SESSION_BUBBLE_FG_COLOR1 bg=$SESSION_BUBBLE_BG_COLOR0]$LBORDER"\
"#[fg=$SESSION_BUBBLE_BG_COLOR1 bg=$SESSION_BUBBLE_FG_COLOR1]$SESSION_INNER_BORDER$SESSION_ICON #S$SESSION_INNER_BORDER"\
"#[fg=$SESSION_BUBBLE_FG_COLOR1 bg=$SESSION_BUBBLE_BG_COLOR0]$RBORDER"

set-option -g status-left "#{?client_prefix,$STATUS_ACTIVE,$STATUS_INACTIVE}#[default] test #{pomodoro_status}#[default]"

# }}}


# ------------------------------------------------------------------------------
# Status right — copilot usage + date + time + battery {{{
# ------------------------------------------------------------------------------

CALHOUR=" #[italics]%d/%m #[noitalics]%H:%M"
BATTERY=" #[fg=$SESSION_BUBBLE_BG_COLOR,bg=$SESSION_BUBBLE_FG_COLOR]#{battery_icon} #{battery_remain}"
COPILOT="#(~/.config/tmux/plugins/agent-usage/scripts/agent_usage.sh)"

STATUS_RIGHT="$CALHOUR"
# STATUS_RIGHT="$CALHOUR$BATTERY"
STATUS_RIGHT="#[fg=$SESSION_BUBBLE_FG_COLOR0 bg=$SESSION_BUBBLE_BG_COLOR0]$LBORDER"\
"#[fg=$SESSION_BUBBLE_BG_COLOR0 bg=$SESSION_BUBBLE_FG_COLOR0] t $STATUS_RIGHT"\
"#[fg=$SESSION_BUBBLE_FG_COLOR0 bg=$SESSION_BUBBLE_BG_COLOR0]$RBORDER"

set-option -g status-right " $COPILOT t $STATUS_RIGHT#[default]"

bind-key -T root MouseDown1StatusRight \
    display-popup -E -w 54 -h 10 \
    "bash -c '$HOME/.config/tmux/plugins/agent-usage/scripts/agent_usage.sh --popup | less -R'"

# }}}


# ------------------------------------------------------------------------------
# Window formatting {{{
# ------------------------------------------------------------------------------

LICON="#{?window_bell_flag,#[fg=$ACTIVE_FG_COLOR]$BELL_ICON,$WINDOW_INNER_BORDER}"
RICON="#{?window_active,#{?window_zoomed_flag,⧉,$WINDOW_INNER_BORDER},$WINDOW_INNER_BORDER}"

WNUM='#($HOME/.config/tmux/helpers/window_to_num #I) '

WINDOW_INACTIVE=""\
"#[bg=$WINDOW_BUBBLE_BG_COLOR0 fg=$WINDOW_BUBBLE_FG_COLOR0]$WINDOW_LBORDER"\
"#[bg=$WINDOW_BUBBLE_FG_COLOR0 fg=$WINDOW_BUBBLE_BG_COLOR0]$LICON"\
"#[dim]${WNUM}#W#[nodim]"\
"#[bg=$WINDOW_BUBBLE_FG_COLOR0 fg=$WINDOW_BUBBLE_BG_COLOR0]$RICON"\
"#[bg=$WINDOW_BUBBLE_BG_COLOR0 fg=$WINDOW_BUBBLE_FG_COLOR0]$WINDOW_RBORDER"

WINDOW_ACTIVE=""\
"#[bg=$WINDOW_BUBBLE_BG_COLOR1 fg=$WINDOW_BUBBLE_FG_COLOR1]$WINDOW_LBORDER"\
"#[bg=$WINDOW_BUBBLE_FG_COLOR1 fg=$WINDOW_BUBBLE_BG_COLOR1]$LICON"\
"#[nodim]${WNUM}#[bold]#W"\
"#[bg=$WINDOW_BUBBLE_FG_COLOR1 fg=$WINDOW_BUBBLE_BG_COLOR1]$RICON"\
"#[bg=$WINDOW_BUBBLE_BG_COLOR1 fg=$WINDOW_BUBBLE_FG_COLOR1]$WINDOW_RBORDER"

set-window-option -g window-status-format "$WINDOW_INACTIVE"
set-window-option -g window-status-current-format "$WINDOW_ACTIVE"
set-window-option -g window-status-separator "$WINDOW_SEPARATION_BORDER"

# }}}

# vim: ft=tmux fdm=marker
